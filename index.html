<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f1">
    <title>book — A quiet place for your notes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--page-bg);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --page-bg: #f6f5f1;
        --surface: #fff;
        --text: #242a24;
        --muted: #757b73;
        --line: #e6e5df;
        --green: #315d43;
        --green-dark: #244a34;
        --primary-bg: #315d43;
        --primary-hover: #244a34;
        --quiet-text: #464d45;
        --input-border: #dcded7;
        --placeholder: #858b83;
        --surface-hover: #fbfcfa;
        --error: #a23c32;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: #171a17;
        --surface: #202520;
        --text: #e9ece7;
        --muted: #a0aaa0;
        --line: #353d36;
        --green: #a0d4ab;
        --green-dark: #b7e2c0;
        --primary-bg: #315d43;
        --primary-hover: #244a34;
        --quiet-text: #d7dfd7;
        --input-border: #465047;
        --placeholder: #a0aaa0;
        --surface-hover: #29312a;
        --error: #ff9b90;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; color: var(--text); background: var(--page-bg); transition: color 160ms ease, background-color 160ms ease; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }

      .page { width: min(100% - 40px, 760px); margin: 0 auto; padding: 64px 0 80px; }
      .header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .eyebrow { margin: 0 0 12px; color: var(--green); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 400; letter-spacing: -0.065em; }
      .theme-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--quiet-text); background: var(--surface); font-size: 0.85rem; font-weight: 600; }
      .theme-toggle:hover { background: var(--surface-hover); }
      .intro { margin: 12px 0 34px; color: var(--muted); line-height: 1.6; }

      .composer { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 8px 26px rgb(34 42 34 / 4%); }
      .composer label { display: block; margin-bottom: 10px; font-size: 0.9rem; font-weight: 650; }
      textarea { display: block; width: 100%; min-height: 112px; resize: vertical; padding: 13px 14px; border: 1px solid var(--input-border); border-radius: 7px; color: var(--text); background: var(--surface); line-height: 1.55; }
      textarea:focus, input:focus-visible, button:focus-visible { outline: 3px solid rgb(49 93 67 / 24%); outline-offset: 2px; }
      textarea::placeholder, input::placeholder { color: var(--placeholder); }

      .composer-footer, .toolbar, .section-heading, .entry-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .composer-footer { margin-top: 13px; }
      .hint, .status, .entry-date, .count { color: var(--muted); font-size: 0.82rem; }
      .status { min-height: 1.25em; }
      .status[data-error="true"] { color: var(--error); }
      .primary, .quiet-button { min-height: 40px; padding: 0 15px; border-radius: 6px; font-size: 0.88rem; font-weight: 650; }
      .primary { border: 1px solid var(--primary-bg); color: #fff; background: var(--primary-bg); }
      .primary:hover { background: var(--primary-hover); }
      .quiet-button { border: 1px solid var(--line); color: var(--quiet-text); background: var(--surface); }
      .quiet-button:hover { border-color: var(--input-border); background: var(--surface-hover); }

      .history { margin-top: 44px; }
      .section-heading { align-items: baseline; margin-bottom: 15px; }
      h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; font-weight: 400; }
      .toolbar { margin-bottom: 14px; }
      .search { flex: 1; min-width: 0; height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--surface); }
      .actions { display: flex; gap: 8px; }
      .actions button { min-height: 42px; }
      .import-label { display: inline-flex; align-items: center; justify-content: center; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      .entries { padding: 0; margin: 0; list-style: none; border-top: 1px solid var(--line); }
      .entry { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 19px 2px; border-bottom: 1px solid var(--line); }
      .entry-date { padding-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .entry-text { margin: 0; line-height: 1.65; overflow-wrap: anywhere; white-space: pre-wrap; }
      .empty { padding: 30px 12px; color: var(--muted); text-align: center; }
      .privacy { margin-top: 22px; color: var(--muted); font-size: 0.78rem; line-height: 1.5; text-align: center; }

      @media (max-width: 560px) {
        .page { width: min(100% - 28px, 760px); padding-top: 38px; }
        .theme-toggle { padding: 0 10px; }
        .composer { padding: 15px; }
        .composer-footer, .toolbar { align-items: stretch; flex-direction: column; }
        .composer-footer .primary { width: 100%; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; }
        .actions button { width: 100%; }
        .entry { grid-template-columns: 1fr; gap: 6px; padding: 16px 2px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="header-top">
          <p class="eyebrow">Your personal space</p>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span id="theme-icon" aria-hidden="true">☾</span>
            <span id="theme-label">Dark mode</span>
          </button>
        </div>
        <h1>book</h1>
        <p class="intro">A quiet place to keep track of what matters.</p>
      </header>

      <form class="composer" id="entry-form">
        <label for="entry-input">What’s on your mind?</label>
        <textarea id="entry-input" placeholder="Write a note..." required></textarea>
        <div class="composer-footer">
          <span class="hint">Saved only in this browser.</span>
          <button class="primary" type="submit">Add to log <span aria-hidden="true">→</span></button>
        </div>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="history" aria-labelledby="history-heading">
        <div class="section-heading">
          <h2 id="history-heading">History</h2>
          <span class="count" id="entry-count"></span>
        </div>
        <div class="toolbar">
          <label class="visually-hidden" for="search-input">Search entries by note or date</label>
          <input class="search" id="search-input" type="search" placeholder="Search your log…">
          <div class="actions">
            <button class="quiet-button" id="export-button" type="button">Export JSON</button>
            <button class="quiet-button import-label" id="import-button" type="button">Import JSON</button>
            <input class="visually-hidden" id="import-input" type="file" accept="application/json,.json">
          </div>
        </div>
        <ol class="entries" id="entries"></ol>
      </section>

      <p class="privacy">Your notes stay in this browser. Export a JSON backup to move them or keep a copy.</p>
    </main>

    <script>
      (() => {
        const STORAGE_KEY = 'logbook-history';
        const form = document.getElementById('entry-form');
        const entryInput = document.getElementById('entry-input');
        const searchInput = document.getElementById('search-input');
        const entriesList = document.getElementById('entries');
        const entryCount = document.getElementById('entry-count');
        const status = document.getElementById('status');
        const exportButton = document.getElementById('export-button');
        const importButton = document.getElementById('import-button');
        const importInput = document.getElementById('import-input');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeLabel = document.getElementById('theme-label');
        let history = {};
        let storageReady = true;

        function setStatus(message, isError = false) {
          status.textContent = message;
          status.dataset.error = String(isError);
        }

        function applyTheme(theme) {
          const isDark = theme === 'dark';
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = isDark ? '#171a17' : '#f6f5f1';
          themeToggle.setAttribute('aria-pressed', String(isDark));
          themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
          themeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
          themeIcon.textContent = isDark ? '☀' : '☾';
        }

        function loadTheme() {
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          try {
            return localStorage.getItem('book-theme') || systemTheme;
          } catch (error) {
            setStatus(`Could not load saved theme preference: ${error.message}`, true);
            return systemTheme;
          }
        }

        function isHistory(value) {
          return value !== null &&
            typeof value === 'object' &&
            !Array.isArray(value) &&
            Object.entries(value).every(([key, text]) =>
              Number.isFinite(Number(key)) &&
              Number.isFinite(new Date(Number(key)).getTime()) &&
              typeof text === 'string'
            );
        }

        function loadHistory() {
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored === null) return {};
            const parsed = JSON.parse(stored);
            if (!isHistory(parsed)) throw new Error('Stored history has an invalid format.');
            return parsed;
          } catch (error) {
            storageReady = false;
            setStatus(`Could not load browser history: ${error.message} Import a valid backup to recover it.`, true);
            return {};
          }
        }

        function persistHistory(nextHistory) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(nextHistory));
            history = nextHistory;
            storageReady = true;
            return true;
          } catch (error) {
            setStatus(`Could not save history: ${error.message}`, true);
            return false;
          }
        }

        function formatTimestamp(epochMs) {
          const date = new Date(Number(epochMs));
          const yy = String(date.getFullYear()).slice(-2);
          const mm = String(date.getMonth() + 1).padStart(2, '0');
          const dd = String(date.getDate()).padStart(2, '0');
          let hours = date.getHours();
          const minutes = String(date.getMinutes()).padStart(2, '0');
          const ampm = hours >= 12 ? 'pm' : 'am';
          hours = hours % 12 || 12;
          const hh = String(hours).padStart(2, '0');
          return `${yy}-${mm}-${dd} ${hh}:${minutes} ${ampm}`;
        }

        function render() {
          const query = searchInput.value.trim().toLowerCase();
          const filtered = Object.entries(history)
            .filter(([epochMs, text]) =>
              text.toLowerCase().includes(query) ||
              formatTimestamp(epochMs).toLowerCase().includes(query)
            )
            .sort(([a], [b]) => Number(b) - Number(a));

          entryCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'entry' : 'entries'}`;
          entriesList.replaceChildren();

          if (filtered.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty';
            empty.textContent = query ? 'No entries match your search.' : 'Your log is empty. Add your first note above.';
            entriesList.append(empty);
            return;
          }

          for (const [epochMs, text] of filtered) {
            const item = document.createElement('li');
            item.className = 'entry';
            const date = document.createElement('time');
            date.className = 'entry-date';
            date.dateTime = new Date(Number(epochMs)).toISOString();
            date.textContent = formatTimestamp(epochMs);
            const note = document.createElement('p');
            note.className = 'entry-text';
            note.textContent = text;
            item.append(date, note);
            entriesList.append(item);
          }
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const text = entryInput.value.trim();
          if (!text) {
            setStatus('Write a note before adding it.', true);
            entryInput.focus();
            return;
          }
          if (!storageReady) {
            setStatus('History is unavailable. Import a valid backup to recover it before adding notes.', true);
            return;
          }

          let timestamp = Date.now();
          while (Object.prototype.hasOwnProperty.call(history, String(timestamp))) timestamp += 1;
          const nextHistory = { ...history, [timestamp]: text };
          if (persistHistory(nextHistory)) {
            entryInput.value = '';
            setStatus('Added to your log.');
            render();
          }
        });

        searchInput.addEventListener('input', render);

        themeToggle.addEventListener('click', () => {
          const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(theme);
          try {
            localStorage.setItem('book-theme', theme);
            setStatus(`${theme === 'dark' ? 'Dark' : 'Light'} mode enabled.`);
          } catch (error) {
            setStatus(`Theme changed, but could not save your preference: ${error.message}`, true);
          }
        });

        exportButton.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'book-export.json';
          link.click();
          URL.revokeObjectURL(url);
          setStatus(`Exported ${Object.keys(history).length} ${Object.keys(history).length === 1 ? 'entry' : 'entries'}.`);
        });

        importButton.addEventListener('click', () => importInput.click());
        importInput.addEventListener('change', async () => {
          const file = importInput.files[0];
          if (!file) return;

          try {
            const imported = JSON.parse(await file.text());
            if (!isHistory(imported)) {
              throw new Error('Expected a JSON object mapping numeric timestamps to note text.');
            }
            if (!storageReady) {
              const recovered = persistHistory(imported);
              if (!recovered) return;
              setStatus(`Recovered history with ${Object.keys(imported).length} ${Object.keys(imported).length === 1 ? 'entry' : 'entries'}.`);
            } else {
              const nextHistory = { ...history };
              let added = 0;
              for (const [epochMs, text] of Object.entries(imported)) {
                if (!Object.prototype.hasOwnProperty.call(nextHistory, epochMs)) {
                  nextHistory[epochMs] = text;
                  added += 1;
                }
              }
              if (!persistHistory(nextHistory)) return;
              setStatus(`Imported ${added} new ${added === 1 ? 'entry' : 'entries'}; existing entries were kept.`);
            }
            render();
          } catch (error) {
            setStatus(`Could not import JSON: ${error.message}`, true);
          } finally {
            importInput.value = '';
          }
        });

        applyTheme(loadTheme());
        history = loadHistory();
        render();
      })();
    </script>
  </body>
</html>
